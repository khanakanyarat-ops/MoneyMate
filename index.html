<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledgerly – จัดการรายรับรายจ่าย</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#12302e;--mute:#6b7f7c;--line:#e2eae8;--side:#0f2a28;--side-ink:#cfe3df;--acc:#0e8f7e;--acc-soft:#dff3ef;--inc:#0e9f6e;--exp:#e5584f;--shadow:0 1px 2px rgba(15,42,40,.06),0 8px 24px -12px rgba(15,42,40,.12);--r:16px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1716;--card:#12211f;--ink:#e6f1ef;--mute:#8aa29e;--line:#1f3330;--side:#081211;--acc:#2fc4ae;--acc-soft:#14312d;--inc:#34d399;--exp:#fb7185;--shadow:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0b1716;--card:#12211f;--ink:#e6f1ef;--mute:#8aa29e;--line:#1f3330;--side:#081211;--acc:#2fc4ae;--acc-soft:#14312d;--inc:#34d399;--exp:#fb7185;--shadow:0 1px 2px rgba(0,0,0,.4)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.65 "Noto Sans Thai",Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--side-ink);padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;color:#fff;padding:0 10px 22px}
.logo{width:32px;height:32px;border-radius:10px;background:var(--acc);display:grid;place-items:center;color:#06201c;font-weight:800}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;border:0;background:none;color:inherit;text-align:left;width:100%;font-weight:600}
.nav:hover{background:rgba(255,255,255,.07)}
.nav.on{background:rgba(255,255,255,.12);color:#fff}
.nav svg{width:20px;height:20px;flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
main{padding:28px clamp(16px,3vw,40px) 40px;max-width:1180px;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mute);margin:2px 0 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--acc);color:#04201b;display:inline-flex;gap:8px;align-items:center}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--exp);color:#fff}
.sel,.inp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.sel{width:auto}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;border:1px solid var(--line)}
.card h2{font-size:16px;margin:0 0 4px;font-weight:700}
.hint{color:var(--mute);font-size:13px}
.hero{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:16px;margin-bottom:16px}
.balance .big{font-size:clamp(34px,5vw,52px);font-weight:800;line-height:1.1;margin:8px 0 14px}
.flow{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line)}
.flow i{display:block;height:100%;transition:width .5s}
.legend{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;color:var(--mute)}
.stat .v{font-size:28px;font-weight:800;margin-top:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:16px}
svg.chart{width:100%;height:auto;display:block;margin-top:10px}
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:10px}
.donutwrap svg{width:150px;height:150px;flex:none}
.cl{flex:1;min-width:140px;display:flex;flex-direction:column;gap:7px;font-size:13px}
.cl div{display:flex;justify-content:space-between;gap:8px}
.tx{display:grid;grid-template-columns:42px 1fr auto auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}
.ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px}
.tx .t{font-weight:700}.tx .m{font-size:13px;color:var(--mute)}
.amt{font-weight:800;text-align:right}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.acts{display:flex;gap:2px}
.ib{border:0;background:none;color:var(--mute);padding:6px;border-radius:8px;display:grid;place-items:center}
.ib:hover{background:var(--acc-soft);color:var(--ink)}
.ib svg{width:17px;height:17px}
.filters{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;margin-bottom:14px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mute)}
.search .inp{padding-left:40px}
.empty{text-align:center;padding:38px 10px;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.cat{display:flex;flex-direction:column;gap:10px}
.cat .h{display:flex;align-items:center;gap:12px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font-weight:700;color:var(--mute)}
.seg button.on.i{background:var(--inc);color:#fff}.seg button.on.e{background:var(--exp);color:#fff}
.modal{position:fixed;inset:0;background:rgba(5,18,16,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.sheet{background:var(--card);border-radius:20px;padding:24px;width:100%;max-width:440px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px;animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(12px);opacity:0}}
.sheet h2{margin:0;font-size:20px}
label{font-size:13px;font-weight:700;color:var(--mute);display:flex;flex-direction:column;gap:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--side);color:#fff;padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%)}
.bottom{display:none}
@media(max-width:860px){
 .app{grid-template-columns:1fr}
 aside{display:none}
 main{padding-bottom:96px}
 .hero,.grid2{grid-template-columns:1fr}
 .filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}
 .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--side);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:40}
 .bottom .nav{flex-direction:column;gap:2px;font-size:11px;width:auto;padding:6px 14px;align-items:center}
 .tx{grid-template-columns:42px 1fr auto}.tx .acts{grid-column:2/4;justify-content:flex-end}
}
.mbar,.fab{display:none}
html{-webkit-text-size-adjust:100%}
.btn,.nav,.ib,.seg button{touch-action:manipulation}
main{min-width:0;margin:0 auto}
.tx>div:nth-child(2){min-width:0}
.tx .t,.tx .m{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:1000px){.hero{grid-template-columns:1fr 1fr}.hero .balance{grid-column:1/-1}.grid2{grid-template-columns:1fr}}
@media(max-width:860px){
 .mbar{display:flex;align-items:center;justify-content:space-between;background:var(--side);color:#fff;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));position:sticky;top:0;z-index:30}
 .mbar .ib{color:var(--side-ink);width:42px;height:42px}
 .mbar .ib:hover{background:rgba(255,255,255,.1)}
 .fab{display:grid;place-items:center;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:#04201b;box-shadow:0 8px 20px -6px rgba(0,0,0,.45);z-index:45}
 .hm{display:none}
 main{padding:18px max(14px,env(safe-area-inset-right,0px)) 130px max(14px,env(safe-area-inset-left,0px))}
 h1{font-size:23px}
 .top{margin-bottom:16px}
 .top .row{width:100%}.top .row .sel{flex:1}
 .card{padding:16px}
 .stat .v{font-size:clamp(17px,5.4vw,26px)}
 .bottom .nav{flex:1;justify-content:center}
 .ib{padding:10px}
 .inp,.sel{font-size:16px}
 .filters .sel{width:100%}.filters .sel:last-child{grid-column:1/-1}
 .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
}
@media(max-width:560px){
 .modal{align-items:flex-end;padding:0}
 .sheet{max-width:none;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px))}
}
@media(max-width:420px){.two{grid-template-columns:1fr}}
#print{display:none}
@media print{
 @page{margin:14mm}
 html,body{background:#fff!important;color:#111}
 :root{padding:0}
 .app,.bottom,.modal,.toast,.mbar,.fab{display:none!important}
 #print{display:block;color:#111;font-size:12px;line-height:1.6}
 #print h1{font-size:22px;margin:0}#print h2{font-size:14px;margin:20px 0 6px}
 #print .pm{color:#555;margin:2px 0 14px}
 #print .ps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
 #print .ps div{border:1px solid #ccc;border-radius:8px;padding:8px 12px}
 #print .ps span{display:block;color:#555;font-size:11px}#print .ps b{font-size:16px}
 #print table{width:100%;border-collapse:collapse}
 #print th,#print td{text-align:left;padding:5px 6px;border-bottom:1px solid #ddd}
 #print .r{text-align:right}
 #print tr{break-inside:avoid}#print thead{display:table-header-group}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="mbar"><div class="brand" style="padding:0"><span class="logo">L</span>Ledgerly</div><div class="row" style="gap:4px"><button class="ib" id="theme2" aria-label="เปลี่ยนธีม"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/></svg></button><button class="ib" id="reset2" aria-label="ล้างข้อมูลทั้งหมด"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button></div></header>
<div class="app">
<aside>
 <div class="brand"><span class="logo">L</span>Ledgerly</div>
 <button class="nav on" data-v="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>แดชบอร์ด</button>
 <button class="nav" data-v="tx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h13M13 3l4 4-4 4M20 17H7M11 13l-4 4 4 4"/></svg>รายการธุรกรรม</button>
 <button class="nav" data-v="cat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12l9-9h8v8l-9 9z"/><circle cx="15.5" cy="8.5" r="1.2"/></svg>หมวดหมู่</button>
 <div class="side-foot">
  <button class="nav" id="theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/></svg>เปลี่ยนธีม</button>
  <button class="nav" id="reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 109-9 9 9 0 00-7 3M3 4v4h4"/></svg>ล้างข้อมูลทั้งหมด</button>
 </div>
</aside>
<main id="main"></main>
</div>
<nav class="bottom">
 <button class="nav on" data-v="dash">แดชบอร์ด</button>
 <button class="nav" data-v="tx">ธุรกรรม</button>
 <button class="nav" data-v="cat">หมวดหมู่</button>
</nav>

<div id="print"></div>
<button class="fab" id="fab" aria-label="เพิ่มรายการ"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(n,d=2)=>new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',minimumFractionDigits:d,maximumFractionDigits:d}).format(n);
const fdate=d=>new Date(d+'T00:00:00').toLocaleDateString('th-TH',{month:'short',day:'numeric',year:'numeric'});
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const KEY='ledgerly.th.v2';
const DEF_CATS=[
 {id:'salary',name:'เงินเดือน',type:'income',icon:'💼',color:'#0e9f6e'},
 {id:'freelance',name:'งานฟรีแลนซ์',type:'income',icon:'💻',color:'#2fb5a3'},
 {id:'invest',name:'การลงทุน',type:'income',icon:'📈',color:'#6c8cff'},
 {id:'housing',name:'ที่อยู่อาศัย',type:'expense',icon:'🏠',color:'#6c5ce7'},
 {id:'food',name:'อาหารและเครื่องดื่ม',type:'expense',icon:'🍜',color:'#f59f3a'},
 {id:'transport',name:'การเดินทาง',type:'expense',icon:'🚌',color:'#3aa0f5'},
 {id:'shopping',name:'ช้อปปิ้ง',type:'expense',icon:'🛍️',color:'#e5584f'},
 {id:'bills',name:'ค่าน้ำค่าไฟและบิล',type:'expense',icon:'💡',color:'#c2a63a'},
 {id:'fun',name:'บันเทิง',type:'expense',icon:'🎬',color:'#d45fb0'},
 {id:'health',name:'สุขภาพ',type:'expense',icon:'🩺',color:'#3cc48a'}];
let S={tx:[],cats:DEF_CATS,view:'dash',period:'m6',f:{q:'',type:'all',cat:'all',sort:'new'},nid:1000};
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.tx){S.tx=d.tx;S.cats=d.cats;S.nid=d.nid||1000;return}}catch(e){}S.tx=[];}
function save(){try{localStorage.setItem(KEY,JSON.stringify({tx:S.tx,cats:S.cats,nid:S.nid}))}catch(e){}}
const cat=id=>S.cats.find(c=>c.id===id)||{name:'อื่น ๆ',icon:'•',color:'#8aa29e'};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}

const PERIODS={m:'เดือนนี้',m3:'3 เดือนล่าสุด',m6:'6 เดือนล่าสุด',all:'ทั้งหมด'};
function inPeriod(t){
 if(S.period==='all')return true;const n=new Date();const k={m:0,m3:2,m6:5}[S.period];
 const start=ymd(new Date(n.getFullYear(),n.getMonth()-k,1));return t.date>=start;
}
const sum=(a,type)=>a.filter(t=>t.type===type).reduce((s,t)=>s+t.amount,0);

function monthly(){
 const n=new Date(),out=[];
 for(let i=5;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);const p=ymd(d).slice(0,7);
  const a=S.tx.filter(t=>t.date.startsWith(p));out.push({label:d.toLocaleDateString('th-TH',{month:'short'}),inc:sum(a,'income'),exp:sum(a,'expense')})}
 return out;
}
function barChart(data){
 const N=innerWidth<600,W=N?340:600,H=N?230:240,pl=N?40:44,pb=28,pt=10,max=Math.max(1000,...data.flatMap(d=>[d.inc,d.exp]));
 const step=Math.pow(10,Math.floor(Math.log10(max)));let top=Math.ceil(max/step)*step;if(top/step>7)top=Math.ceil(max/(step*2))*step*2;
 const ch=H-pb-pt,gw=(W-pl)/data.length;let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="รายรับเทียบรายจ่ายรายเดือน">`;
 for(let i=0;i<=4;i++){const y=pt+ch-ch*i/4;s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--mute)">฿${Math.round(top*i/4/1000*10)/10}k</text>`}
 data.forEach((d,i)=>{const x=pl+gw*i+gw/2,bw=Math.min(22,gw/3.2);
  [['inc','var(--inc)',-bw-2,'รายรับ'],['exp','var(--exp)',2,'รายจ่าย']].forEach(([k,c,off,l])=>{const h=d[k]>0?Math.max(3,ch*d[k]/top):0;
   s+=`<rect x="${x+off}" y="${pt+ch-h}" width="${bw}" height="${h}" rx="6" fill="${c}"><title>${d.label} · ${l}: ${money(d[k],0)}</title></rect>`});
  s+=`<text x="${x}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--mute)">${d.label}</text>`});
 return s+'</svg>';
}
function donut(items,total){
 const R=58,C=2*Math.PI*R;let off=0,s=`<svg viewBox="0 0 150 150" role="img" aria-label="รายจ่ายตามหมวดหมู่"><circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--line)" stroke-width="18"/>`;
 items.forEach(i=>{const len=C*i.v/total;s+=`<circle cx="75" cy="75" r="${R}" fill="none" stroke="${i.c.color}" stroke-width="18" stroke-dasharray="${Math.max(0,len-2)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"><title>${esc(i.c.name)}: ${money(i.v,0)}</title></circle>`;off+=len});
 return s+`<text x="75" y="72" text-anchor="middle" font-size="11" fill="var(--mute)">ใช้จ่าย</text><text x="75" y="92" text-anchor="middle" font-size="16" font-weight="800" fill="var(--ink)">${money(total,0)}</text></svg>`;
}
function txRow(t,acts=true){
 const c=cat(t.cat);const sign=t.type==='income'?'+':'−';
 return `<div class="tx"><div class="ic" style="background:${c.color}22">${c.icon}</div>
 <div><div class="t">${esc(t.note||c.name)}</div><div class="m">${esc(c.name)} · ${fdate(t.date)}</div></div>
 <div class="amt num ${t.type==='income'?'inc':'exp'}">${sign}${money(t.amount)}</div>
 ${acts?`<div class="acts"><button class="ib" data-edit="${t.id}" aria-label="แก้ไข"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button><button class="ib" data-del="${t.id}" aria-label="ลบ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button></div>`:'<span></span>'}</div>`;
}
const periodSel=()=>`<select class="sel" id="period" aria-label="ช่วงเวลา">${Object.entries(PERIODS).map(([k,v])=>`<option value="${k}"${S.period===k?' selected':''}>${v}</option>`).join('')}</select>`;
const addBtn=`<button class="btn hm" id="add"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>เพิ่มรายการ</button>`;

const pdfBtn=`<button class="btn ghost" id="pdf"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>ดาวน์โหลด PDF</button>`;
function dash(){
 const a=S.tx.filter(inPeriod),inc=sum(a,'income'),exp=sum(a,'expense'),net=inc-exp,tot=inc+exp||1;
 const rate=inc>0?Math.round(net/inc*100):0;
 const by={};a.filter(t=>t.type==='expense').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amount);
 const items=Object.entries(by).map(([id,v])=>({c:cat(id),v})).sort((x,y)=>y.v-x.v);
 const top=items.slice(0,5),rest=items.slice(5).reduce((s,i)=>s+i.v,0);if(rest>0)top.push({c:{name:'อื่น ๆ',color:'#8aa29e'},v:rest});
 const recent=[...S.tx].sort((x,y)=>y.date.localeCompare(x.date)||y.id-x.id).slice(0,6);
 return `<div class="top"><div><h1>แดชบอร์ด</h1><p class="sub">ภาพรวมการเงินของคุณ · ${PERIODS[S.period]}</p></div><div class="row">${periodSel()}${pdfBtn}${addBtn}</div></div>
 <section class="hero">
  <div class="card balance"><span class="hint">ยอดคงเหลือสุทธิ</span><div class="big num ${net<0?'exp':''}">${money(net)}</div>
   <div class="flow" aria-hidden="true"><i style="width:${inc/tot*100}%;background:var(--inc)"></i><i style="width:${exp/tot*100}%;background:var(--exp)"></i></div>
   <div class="legend"><span>${!a.length?'เริ่มบันทึกรายการแรกของคุณได้เลย':rate>=0?`คุณเก็บเงินได้ ${rate}% ของรายรับ`:`รายจ่ายสูงกว่ารายรับ ${Math.abs(rate)}%`}</span><span class="num">${a.length} รายการ</span></div></div>
  <div class="card stat"><span class="hint"><span class="dot" style="background:var(--inc)"></span>รายรับรวม</span><div class="v num inc">${money(inc)}</div></div>
  <div class="card stat"><span class="hint"><span class="dot" style="background:var(--exp)"></span>รายจ่ายรวม</span><div class="v num exp">${money(exp)}</div></div>
 </section>
 <section class="grid2">
  <div class="card"><h2>รายรับเทียบรายจ่าย</h2><span class="hint">6 เดือนล่าสุด</span>${barChart(monthly())}
   <div class="row hint" style="margin-top:6px"><span><span class="dot" style="background:var(--inc)"></span>รายรับ</span><span><span class="dot" style="background:var(--exp)"></span>รายจ่าย</span></div></div>
  <div class="card"><h2>เงินของคุณไปไหนบ้าง</h2><span class="hint">รายจ่ายตามหมวดหมู่</span>
   ${exp>0?`<div class="donutwrap">${donut(top,exp)}<div class="cl">${top.map(i=>`<div><span><span class="dot" style="background:${i.c.color}"></span>${esc(i.c.name)}</span><b class="num">${Math.round(i.v/exp*100)}%</b></div>`).join('')}</div></div>`:`<div class="empty"><b>ยังไม่มีรายจ่าย</b>เพิ่มรายการเพื่อดูสัดส่วน</div>`}</div>
 </section>
 <section class="card"><div class="row" style="justify-content:space-between"><h2>รายการล่าสุด</h2><button class="btn ghost" data-go="tx">ดูทั้งหมด</button></div>
  ${recent.length?recent.map(t=>txRow(t,false)).join(''):`<div class="empty"><b>ยังไม่มีรายการ</b>เพิ่มรายรับหรือรายจ่ายรายการแรกเพื่อเริ่มต้น</div>`}</section>`;
}
function filtered(){
 const f=S.f,q=f.q.trim().toLowerCase();
 let a=S.tx.filter(t=>{
  if(f.type!=='all'&&t.type!==f.type)return false;if(f.cat!=='all'&&t.cat!==f.cat)return false;
  if(!q)return true;const c=cat(t.cat);
  return [t.note,c.name,String(t.amount),t.amount.toFixed(2),t.date,fdate(t.date)].join(' ').toLowerCase().includes(q)});
 const s={new:(x,y)=>y.date.localeCompare(x.date)||y.id-x.id,old:(x,y)=>x.date.localeCompare(y.date)||x.id-y.id,high:(x,y)=>y.amount-x.amount,low:(x,y)=>x.amount-y.amount}[f.sort];
 return a.sort(s);
}
function txView(){
 const f=S.f;
 return `<div class="top"><div><h1>รายการธุรกรรม</h1><p class="sub">ค้นหา กรอง และจัดการทุกรายการ</p></div><div class="row">${pdfBtn}${addBtn}</div></div>
 <div class="filters"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input class="inp" id="q" placeholder="ค้นหาจากบันทึก หมวดหมู่ จำนวนเงิน หรือวันที่" value="${esc(f.q)}" aria-label="ค้นหารายการ"></div>
  <select class="sel" id="ft" aria-label="ประเภท"><option value="all">ทุกประเภท</option><option value="income"${f.type==='income'?' selected':''}>รายรับ</option><option value="expense"${f.type==='expense'?' selected':''}>รายจ่าย</option></select>
  <select class="sel" id="fc" aria-label="หมวดหมู่"><option value="all">ทุกหมวดหมู่</option>${S.cats.map(c=>`<option value="${c.id}"${f.cat===c.id?' selected':''}>${c.icon} ${esc(c.name)}</option>`).join('')}</select>
  <select class="sel" id="fs" aria-label="เรียงลำดับ">${[['new','ใหม่สุดก่อน'],['old','เก่าสุดก่อน'],['high','จำนวนเงินมากสุด'],['low','จำนวนเงินน้อยสุด']].map(([k,v])=>`<option value="${k}"${f.sort===k?' selected':''}>${v}</option>`).join('')}</select></div>
 <div class="card" id="list"></div>`;
}
function renderList(){
 const a=filtered(),inc=sum(a,'income'),exp=sum(a,'expense');
 $('#list').innerHTML=a.length?`<div class="hint" style="padding-bottom:6px">พบ ${a.length} รายการ · <span class="inc num">+${money(inc)}</span> · <span class="exp num">−${money(exp)}</span></div>`+a.map(t=>txRow(t)).join('')
  :`<div class="empty"><b>ไม่พบรายการ</b>${S.tx.length?'ลองเปลี่ยนคำค้นหาหรือล้างตัวกรอง':'เพิ่มรายการแรกเพื่อเริ่มต้น'}</div>`;
}
function catView(){
 const a=S.tx.filter(inPeriod),mx=Math.max(1,...S.cats.map(c=>a.filter(t=>t.cat===c.id).reduce((s,t)=>s+t.amount,0)));
 const card=c=>{const l=a.filter(t=>t.cat===c.id),v=l.reduce((s,t)=>s+t.amount,0);
  return `<div class="card cat"><div class="h"><div class="ic" style="background:${c.color}22">${c.icon}</div><div style="flex:1"><div class="t" style="font-weight:700">${esc(c.name)}</div><div class="hint">${l.length} รายการ</div></div>${S.tx.some(t=>t.cat===c.id)?'':`<button class="ib" data-delcat="${c.id}" aria-label="ลบหมวดหมู่"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>`}</div>
  <div class="num" style="font-weight:800;font-size:20px">${money(v,0)}</div><div class="bar"><i style="width:${v/mx*100}%;background:${c.color}"></i></div></div>`};
 return `<div class="top"><div><h1>หมวดหมู่</h1><p class="sub">ดูว่าเงินมาจากไหนและไปไหน · ${PERIODS[S.period]}</p></div><div class="row">${periodSel()}<button class="btn" id="addcat">หมวดหมู่ใหม่</button></div></div>
 <h2 style="margin:0 0 12px;font-size:17px">รายรับ</h2><div class="cats" style="margin-bottom:24px">${S.cats.filter(c=>c.type==='income').map(card).join('')}</div>
 <h2 style="margin:0 0 12px;font-size:17px">รายจ่าย</h2><div class="cats">${S.cats.filter(c=>c.type==='expense').map(card).join('')}</div>`;
}
function render(){
 $('#main').innerHTML={dash,tx:txView,cat:catView}[S.view]();
 $$('.nav[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
 if(S.view==='tx')renderList();
 scrollTo(0,0);
}
function go(v){S.view=v;render()}

/* modal */
function openModal(html){$('#sheet').innerHTML=html;$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open')}
function txForm(id){
 const t=id?S.tx.find(x=>x.id===id):{type:'expense',amount:'',cat:'food',date:ymd(new Date()),note:''};
 let type=t.type;
 const opts=()=>S.cats.filter(c=>c.type===type).map(c=>`<option value="${c.id}"${c.id===t.cat?' selected':''}>${c.icon} ${esc(c.name)}</option>`).join('');
 openModal(`<h2>${id?'แก้ไขรายการ':'เพิ่มรายการ'}</h2>
 <div class="seg"><button class="${type==='expense'?'on e':''}" data-type="expense">รายจ่าย</button><button class="${type==='income'?'on i':''}" data-type="income">รายรับ</button></div>
 <label>จำนวนเงิน (บาท)<input class="inp num" id="m-amt" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" value="${t.amount}"></label>
 <div class="two"><label>หมวดหมู่<select class="inp" id="m-cat">${opts()}</select></label><label>วันที่<input class="inp" id="m-date" type="date" value="${t.date}"></label></div>
 <label>บันทึก<input class="inp" id="m-note" maxlength="60" placeholder="รายการนี้เกี่ยวกับอะไร" value="${esc(t.note)}"></label>
 <div class="hint" id="m-err" style="color:var(--exp);min-height:18px"></div>
 <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="m-cancel">ยกเลิก</button><button class="btn" id="m-save">${id?'บันทึกการแก้ไข':'เพิ่มรายการ'}</button></div>`);
 $$('#sheet [data-type]').forEach(b=>b.onclick=()=>{type=b.dataset.type;$$('#sheet [data-type]').forEach(x=>x.className=x.dataset.type===type?'on '+(type==='income'?'i':'e'):'');t.cat='';$('#m-cat').innerHTML=opts()});
 $('#m-cancel').onclick=closeModal;
 $('#m-save').onclick=()=>{
  const amt=parseFloat($('#m-amt').value),date=$('#m-date').value,c=$('#m-cat').value;
  if(!(amt>0))return $('#m-err').textContent='กรอกจำนวนเงินที่มากกว่า 0';
  if(!date)return $('#m-err').textContent='เลือกวันที่';
  const rec={type,amount:Math.round(amt*100)/100,cat:c,date,note:$('#m-note').value.trim()};
  if(id)Object.assign(S.tx.find(x=>x.id===id),rec);else S.tx.push({id:++S.nid,...rec});
  save();closeModal();render();toast(id?'บันทึกการแก้ไขแล้ว':'เพิ่มรายการแล้ว');
 };
 setTimeout(()=>$('#m-amt').focus(),50);
}
function catForm(){
 openModal(`<h2>หมวดหมู่ใหม่</h2>
 <label>ชื่อ<input class="inp" id="c-name" maxlength="24" placeholder="เช่น ท่องเที่ยว"></label>
 <div class="two"><label>ประเภท<select class="inp" id="c-type"><option value="expense">รายจ่าย</option><option value="income">รายรับ</option></select></label><label>อีโมจิ<input class="inp" id="c-icon" maxlength="2" value="✨"></label></div>
 <label>สี<input class="inp" id="c-color" type="color" value="#0e8f7e" style="height:44px;padding:4px"></label>
 <div class="hint" id="c-err" style="color:var(--exp);min-height:18px"></div>
 <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="c-cancel">ยกเลิก</button><button class="btn" id="c-save">เพิ่มหมวดหมู่</button></div>`);
 $('#c-cancel').onclick=closeModal;
 $('#c-save').onclick=()=>{const n=$('#c-name').value.trim();if(!n)return $('#c-err').textContent='ตั้งชื่อหมวดหมู่';
  if(S.cats.some(c=>c.name.toLowerCase()===n.toLowerCase()))return $('#c-err').textContent='มีหมวดหมู่นี้อยู่แล้ว';
  S.cats.push({id:'c'+Date.now(),name:n,type:$('#c-type').value,icon:$('#c-icon').value||'•',color:$('#c-color').value});save();closeModal();render();toast('เพิ่มหมวดหมู่แล้ว')};
}
function confirmDel(id){
 const t=S.tx.find(x=>x.id===id);
 openModal(`<h2>ลบรายการนี้หรือไม่</h2><p class="sub" style="margin:0">${esc(t.note||cat(t.cat).name)} · ${money(t.amount)} จะถูกลบถาวร</p>
 <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="d-no">เก็บไว้</button><button class="btn danger" id="d-yes">ลบ</button></div>`);
 $('#d-no').onclick=closeModal;
 $('#d-yes').onclick=()=>{S.tx=S.tx.filter(x=>x.id!==id);save();closeModal();render();toast('ลบรายการแล้ว')};
}

function exportPDF(){
 const scope=S.view==='tx';
 const a=(scope?filtered():S.tx.filter(inPeriod)).slice().sort((x,y)=>x.date.localeCompare(y.date)||x.id-y.id);
 if(!a.length)return toast('ยังไม่มีรายการให้ดาวน์โหลด');
 const inc=sum(a,'income'),exp=sum(a,'expense'),by={};
 a.filter(t=>t.type==='expense').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amount);
 const rows=Object.entries(by).sort((x,y)=>y[1]-x[1]);
 $('#print').innerHTML=`<h1>รายงานรายรับรายจ่าย</h1><p class="pm">${scope?'ตามตัวกรองที่เลือก':PERIODS[S.period]} · ออกรายงานเมื่อ ${fdate(ymd(new Date()))}</p>
 <div class="ps"><div><span>รายรับรวม</span><b>${money(inc)}</b></div><div><span>รายจ่ายรวม</span><b>${money(exp)}</b></div><div><span>ยอดคงเหลือสุทธิ</span><b>${money(inc-exp)}</b></div></div>
 ${rows.length?`<h2>รายจ่ายตามหมวดหมู่</h2><table>${rows.map(([id,v])=>`<tr><td>${cat(id).icon} ${esc(cat(id).name)}</td><td class="r">${Math.round(v/exp*100)}%</td><td class="r">${money(v)}</td></tr>`).join('')}</table>`:''}
 <h2>รายการทั้งหมด (${a.length} รายการ)</h2><table><thead><tr><th>วันที่</th><th>บันทึก</th><th>หมวดหมู่</th><th class="r">จำนวนเงิน</th></tr></thead><tbody>${a.map(t=>`<tr><td>${fdate(t.date)}</td><td>${esc(t.note||'-')}</td><td>${esc(cat(t.cat).name)}</td><td class="r">${t.type==='income'?'+':'−'}${money(t.amount)}</td></tr>`).join('')}</tbody></table>`;
 try{window.print()}catch(e){toast('เบราว์เซอร์ไม่รองรับการพิมพ์ในหน้านี้')}
}
/* events */
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-v],[data-go],[data-edit],[data-del],[data-delcat],#add,#addcat,#pdf,#fab');if(!g)return;
 if(g.dataset.v)go(g.dataset.v);else if(g.dataset.go)go(g.dataset.go);
 else if(g.dataset.edit)txForm(+g.dataset.edit);else if(g.dataset.del)confirmDel(+g.dataset.del);
 else if(g.dataset.delcat){S.cats=S.cats.filter(c=>c.id!==g.dataset.delcat);save();render();toast('ลบหมวดหมู่แล้ว')}
 else if(g.id==='pdf')exportPDF();else if(g.id==='add'||g.id==='fab')txForm();else if(g.id==='addcat')catForm();
});
document.addEventListener('change',e=>{
 const id=e.target.id;
 if(id==='period'){S.period=e.target.value;render()}
 else if(id==='ft'){S.f.type=e.target.value;renderList()}
 else if(id==='fc'){S.f.cat=e.target.value;renderList()}
 else if(id==='fs'){S.f.sort=e.target.value;renderList()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.f.q=e.target.value;renderList()}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('#theme').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'};
$('#reset').onclick=()=>{openModal(`<h2>ล้างข้อมูลทั้งหมดหรือไม่</h2><p class="sub" style="margin:0">รายการและหมวดหมู่ที่เพิ่มเองทั้งหมดจะถูกลบถาวร</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" id="r-no">ยกเลิก</button><button class="btn danger" id="r-yes">ล้างข้อมูล</button></div>`);$('#r-no').onclick=closeModal;$('#r-yes').onclick=()=>{S.tx=[];S.cats=DEF_CATS.map(c=>({...c}));S.nid=1000;save();closeModal();render();toast('ล้างข้อมูลแล้ว')}};
$('#theme2').onclick=$('#theme').onclick;$('#reset2').onclick=$('#reset').onclick;
let _n=innerWidth<600;addEventListener('resize',()=>{const n=innerWidth<600;if(n!==_n){_n=n;if(S.view==='dash')render()}});
load();render();
</script>
</body>
</html>
